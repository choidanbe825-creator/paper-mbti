<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>논문 MBTI | 관리자 통계</title><style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#eaf6ff,#fff3f6);font-family:Jua,'Malgun Gothic',sans-serif;color:#244662}main{max-width:850px;margin:auto;padding:28px 16px}h1{font-size:32px}.card{background:white;border:2px solid #c5deee;border-radius:20px;padding:22px;margin:14px 0}input,button{font:inherit;padding:12px;border-radius:12px}input{border:1px solid #b6d4e5;width:100%;margin:7px 0}button{background:#244b68;color:white;border:0;cursor:pointer}.row{display:flex;gap:12px;flex-wrap:wrap}.metric{flex:1;min-width:140px;background:#f1f8ff;border-radius:16px;padding:17px}.num{font-size:30px}.bar{height:19px;border-radius:20px;background:#e6edf4;overflow:hidden;margin:8px 0 16px}.fill{height:100%;background:#79acc8}table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #e3edf4;text-align:left}#dashboard{display:none}#status{color:#b23b54}.muted{color:#69859a;font-size:13px}</style></head><body><main><h1>🍀 논문 MBTI 관리자 통계</h1><div class="card" id="login"><h2>관리자 로그인</h2><form id="loginForm"><input id="email" type="email" placeholder="관리자 이메일" required><input id="password" type="password" placeholder="비밀번호" required><button>로그인</button></form><p id="status"></p></div><section id="dashboard"><div class="row"><h2 style="flex:1">실시간 참여 현황</h2><button id="logout">로그아웃</button></div><div class="row" id="metrics"></div><div class="card"><h2>유형별 비율</h2><div id="bars"></div></div><div class="card"><h2>참여자 목록</h2><p class="muted">입력된 닉네임과 검사 결과가 표시됩니다.</p><div style="overflow:auto"><table><thead><tr><th>닉네임</th><th>유형</th><th>참여 시각</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,collection,onSnapshot,query,orderBy} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const firebaseConfig = {apiKey:"AIzaSyA3Qyf5PP8uiCZUt0c2N5EcqgMXEqDOy_E",authDomain:"paper-mbti.firebaseapp.com",projectId:"paper-mbti",storageBucket:"paper-mbti.firebasestorage.app",messagingSenderId:"150786814220",appId:"1:150786814220:web:0e6f8876b0564ede7f5929"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let unsubscribe=null;
const el=id=>document.getElementById(id),labels={type1:'실행형',type2:'탐색형',type3:'출발형'};
el('loginForm').onsubmit=async e=>{e.preventDefault();el('status').textContent='로그인 중...';try{await signInWithEmailAndPassword(auth,el('email').value,el('password').value);el('password').value='';el('status').textContent='';}catch(err){el('status').textContent='로그인에 실패했습니다. 이메일과 비밀번호를 확인해 주세요.';}};
el('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{if(unsubscribe){unsubscribe();unsubscribe=null;}el('login').style.display=user?'none':'block';el('dashboard').style.display=user?'block':'none';if(!user)return;
 unsubscribe=onSnapshot(query(collection(db,'results'),orderBy('createdAt','desc')),snapshot=>{const data=snapshot.docs.map(d=>d.data());const n=data.length;const counts={type1:0,type2:0,type3:0};data.forEach(d=>{if(d.type in counts)counts[d.type]++;});el('metrics').replaceChildren();el('bars').replaceChildren();
 for(const [key,label] of Object.entries(labels)){const pct=n?(counts[key]/n*100):0;const card=document.createElement('div');card.className='metric';card.textContent=`${label}: ${counts[key]}명 (${pct.toFixed(1)}%)`;el('metrics').append(card);const title=document.createElement('div');title.textContent=`${label} · ${counts[key]}명 (${pct.toFixed(1)}%)`;const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('div');fill.className='fill';fill.style.width=pct+'%';bar.append(fill);el('bars').append(title,bar);}
 const total=document.createElement('div');total.className='metric';total.textContent=`총 참여: ${n}명`;el('metrics').prepend(total);el('rows').replaceChildren();for(const d of data){const tr=document.createElement('tr');const dt=d.createdAt?.toDate?.();for(const v of [d.name||'',labels[d.type]||'',dt?dt.toLocaleString('ko-KR'):'저장 중']){const td=document.createElement('td');td.textContent=v;tr.append(td);}el('rows').append(tr);}},err=>{el('bars').textContent='통계 조회 실패: Firestore 보안 규칙을 확인해 주세요.';console.error(err);});
});
</script></body></html>
